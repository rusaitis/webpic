name: Pages

# The live demo (rusaitis.github.io/webpic). Separate from ci.yml so a deploy hiccup never
# reads as a failing build — and so the demo can be redeployed without re-running the gates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a merged change must not be silently dropped by a later push.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The build emits relative asset URLs (vite.config.ts `base`), so the artifact runs
      # unchanged from the repo subpath Pages serves it under.
      - run: npm run build
      # The @webpic/embed API reference (TypeDoc, treatWarningsAsErrors) publishes under /api/.
      - run: npm run docs:api && mkdir -p dist/api && cp -R docs/api/. dist/api/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
