# Local gates mirroring .github/workflows/ci.yml, sized to their cost: lint is ~200 ms so it
# runs on every commit; the boundary/type/test gates are ~12 s so they run on push. Skip once with
# LEFTHOOK=0 or `git commit --no-verify`. The full gate is `npm run check`.
pre-commit:
  commands:
    biome:
      glob: "*.{ts,json,md}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    boundaries:
      run: npm run check:boundaries
    lint:
      run: npm run lint:ci
    test:
      run: npm run test
