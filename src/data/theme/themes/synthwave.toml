name = "synthwave"

[colors]
background = "#2b1055"
text = [1.000, 0.400, 0.800, 0.95]
secondary_text = [0.700, 0.300, 0.900, 0.85]
grid = [1.000, 1.000, 0.200, 0.15]
accent = "#00fff7"
overlay = [0.800, 0.100, 0.500, 0.75]
overlay_text = [0.000, 1.000, 0.950, 0.95]
overlay_alt = [0.100, 0.050, 0.350, 0.70]
overlay_alt_text = [1.000, 0.900, 0.100, 0.90]
overlay_border = [0.000, 1.000, 0.950, 0.30]
track = [0.200, 1.000, 0.200, 0.35]

[colors.cycle]
values = ["#ff2d95", "#00fff7", "#ffe600", "#b535f6", "#39ff14", "#ff6e27", "#00d4ff", "#ff85c0"]

[colormaps]
sequential = "plasma"
diverging = "PiYG"

[font]
family = ["Helvetica", "DejaVu Sans", "sans-serif"]
title = 14.0
label = 12.0
tick = 11.0
overlay = 10.0

[overlay]
rounding = 1.0
padding = 0.5
margin = 0.04

[lines]
width = 2.0
arrow_size = 6.0
arrow_style = "triangle"

[axes]
x_color = "#ff2d95"
y_color = "#39ff14"
z_color = "#00fff7"
arrows = true

[grid]
major_width = 0.8
minor_width = 0.5
style = "dashed"

[colorbar]
width = "5%"
outline_width = 0.5
tick_length = 3.0
pad = 0.06

[progress_bar]
width = 100.0
height = 6.0
rounding = 3.0

[plot]
rounding = 0.04

# Cross-tool app config consumed by webpic (Three.js/WebGPU viewer).
# pypic itself ignores this section — see plotting/_theme_io.py.
[webpic]
version = 1

[webpic.layout]
# Empty: webpic's chrome floats (top bar owns dataset/field/time, the left rail owns
# axes & grid, the colorbar owns color mapping), so nothing docks by default.
default-panels = []
docked-side = "right"
panel-collapsed-default = false

[webpic.shortcuts]
toggle-volume = "V"
toggle-slices = "S"
toggle-ui = "F"
command-palette = "Cmd+K"

[webpic.diagnostics]
fps-overlay = true
gpu-memory-overlay = false
timestamp-query-overlay = true   # neon: surface the extra overlay

[webpic.embed]
banner-on-cors-failure = true
default-controls-visible = true
