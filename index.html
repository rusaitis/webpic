<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>webpic</title>
    <meta name="description" content="WebGPU plasma-physics data visualizer and lightweight analyzer." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101820" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS standalone: run fullscreen (no Safari chrome), content edge-to-edge under the status bar
         — the topbar/rail already pad by env(safe-area-inset-*), so nothing hides behind it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="webpic" />
    <style>
      :root { color-scheme: dark; }
      /* overscroll-behavior: none kills mobile pull-to-refresh + rubber-band glow fighting the canvas. */
      html, body { margin: 0; height: 100%; background: #101820; overscroll-behavior: none; }
      /* Block layout (not grid place-items:center): a <canvas> is a replaced element with an
         intrinsic aspect ratio, and centering (non-stretch) alignment lets height:100% fall back to
         that ratio — a square canvas overflowing a landscape viewport, sinking the centered render
         below the visible center. A definite-height block lets height:100% fill the viewport. */
      /* 100dvh tracks the live viewport so mobile Safari's retracting address bar can't clip the
         bottom rail (dvh predates WebGPU in every browser that can run this, so no 100vh fallback). */
      #app { width: 100vw; height: 100dvh; overflow: hidden; }
      /* Boot splash: a pre-painted copy of the ui/status/statusPill.ts pill (same geometry, the
         styles.ts fallback palette as literals) so feedback paints at HTML parse — the FCP
         anchor scripts/perf-gate.ts measures, distinct from the WebGPU first frame. It lives
         outside #app to survive the canvas mount; installStatusPill adopts it in place. */
      #splash { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); transform: translateX(-50%); margin: 0;
        display: flex; align-items: center; gap: 9px; padding: 8px 15px;
        background: rgba(16, 24, 32, 0.94); color: #8a94a0;
        border: 1px solid rgba(200, 208, 216, 0.16); border-radius: 999px;
        font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
      #splash::before { content: ""; width: 14px; height: 14px; box-sizing: border-box;
        border-radius: 50%; border: 2px solid rgba(200, 208, 216, 0.16); border-top-color: #5aa9e6;
        animation: webpic-spin 0.9s linear infinite; }
      @keyframes webpic-spin { to { transform: rotate(360deg); } }
      /* The canvas fills #app; the drawing buffer is sized worker-side from clientWidth × DPR. */
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p id="splash">webpic</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
