<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webpic</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #101820; }
      #app { width: 100vw; height: 100vh; display: grid; place-items: center; overflow: hidden; }
      /* Boot splash: a pre-painted copy of the ui/statusPill.ts pill (same geometry, the
         styles.ts fallback palette as literals) so feedback paints at HTML parse — the FCP
         anchor the M0 perf gate measures, distinct from the WebGPU first frame. It lives
         outside #app to survive the canvas mount; installStatusPill adopts it in place. */
      #splash { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); margin: 0;
        display: flex; align-items: center; gap: 9px; padding: 8px 15px;
        background: rgba(16, 24, 32, 0.94); color: #8a94a0;
        border: 1px solid rgba(200, 208, 216, 0.16); border-radius: 999px;
        font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
      #splash::before { content: ""; width: 14px; height: 14px; box-sizing: border-box;
        border-radius: 50%; border: 2px solid rgba(200, 208, 216, 0.16); border-top-color: #5aa9e6;
        animation: webpic-spin 0.9s linear infinite; }
      @keyframes webpic-spin { to { transform: rotate(360deg); } }
      /* The canvas fills #app; the drawing buffer is sized worker-side from clientWidth × DPR. */
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p id="splash">webpic</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
